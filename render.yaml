# Render Blueprint — deploy Backend từ thư mục BE
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: qlytaichinh-api
    runtime: node
    rootDir: BE
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
